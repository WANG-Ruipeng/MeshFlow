ckpt_path: 'path/to/your/checkpoint.pt'

data:
  valid_path: 'debug/valid'
  data_path: 'downloaded_data/shapenet-03636649' # 'downloaded_data/objaverse'

  # recommend to use default settings
  num_workers: 8
  latent_norm: true
  latent_multiplier: 1.0

  do_dataset_normalize: false
  noise_sort: 'ot'
  max_length: 800

  num_bins: 8192  # quantize final results
  use_rot_aug: True  # <---- whether to use rotation augmentation when training
  use_scale_aug: False  # <---- whether to use scaling augmentation when training
  use_repa: False
  use_permut_aug: False
  use_decimated_dataset: True

model:
  model_type: "equidit"
  use_qknorm: false
  use_swiglu: true
  use_rmsnorm: true
  wo_shift: false

  hidden_dim: 768
  num_heads: 12
  max_length: 800
  num_layers: 12
  gradient_checkpointing: False
  use_coord_encoding: True
  version: 1
  pe_freq: 20
  mixed_precision:
  use_dit_like_pe: False
  face_cond: True
  face_bin: 10
  is_latent: True

# recommend to use default settings
train:
  max_steps: 400000
  global_batch_size: 192 # 7*24 for debug
  global_seed: 0
  output_dir: 'output'
  exp_name: 'ldm'
  ckpt: null
  log_every: 100
  ckpt_every: 10000 # 100 for debug
  
optimizer:
  lr: 0.0002
  beta2: 0.95
  
# recommend to use default settings
transport:
  path_type: Linear
  prediction: velocity
  loss_weight: null
  sample_eps: null
  train_eps: null
  use_cosine_loss: True
  use_lognorm: true
  use_jit: false

# recommend to use default settings
sample:
  mode: ODE
  sampling_method: euler
  atol: 0.000001
  rtol: 0.001
  reverse: false
  likelihood: false
  num_sampling_steps: 50
  cfg_scale: 10.0
  # recommend to use default settings
  per_proc_batch_size: 4
  fid_num: 50000
  cfg_interval_start: 0.11
  timestep_shift: 0.3