[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshflow-control"
version = "0.1.0"
description = "Independent Native MeshFlow conditional completion and direct context readout research"
requires-python = ">=3.10"
dependencies = ["torch>=2.7,<2.8", "numpy", "scipy", "PyYAML", "matplotlib", "Pillow", "trimesh"]

[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
meshflow-control = "meshflow_control.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: explicitly budgeted real CUDA integration; not selected in CPU CI"]
