[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshflow-control-r2"
version = "0.1.0"
description = "Native T1 + Geo, balanced conditions and full-course HYBRID FM"
requires-python = ">=3.10"
dependencies = ["torch>=2.7,<2.8", "numpy", "scipy", "PyYAML", "trimesh", "Pillow", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
meshflow-r2 = "meshflow_control.r2_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires an explicitly budgeted CUDA experiment"]
